<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d061a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>
  <!-- Decorative ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  <!-- CT Initials -->
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="url(#iconGrad)" text-anchor="middle" letter-spacing="-5">CT</text>
  <!-- Camera icon overlay -->
  <g fill="none" stroke="#5a4a7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
    <rect x="130" y="280" width="140" height="100" rx="10"/>
    <circle cx="200" cy="330" r="25"/>
    <circle cx="200" cy="330" r="12" fill="#5a4a7a" opacity="0.2"/>
  </g>
  <!-- Text label -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="14" fill="#5a4a7a" text-anchor="middle" font-weight="500">Add your photo here</text>
</svg>